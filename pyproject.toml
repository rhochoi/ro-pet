[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ro-pet"
version = "0.5.0"
description = "ro — desktop pet and local-first Mac assistant (free mini & licensed pro)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial"]

[project.scripts]
ro = "ro.cli:main"
ro-pet = "ro_pet.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["ro", "ro_pet"]
