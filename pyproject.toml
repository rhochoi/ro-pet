[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ro-pet"
version = "0.5.3"
description = "ro — desktop pet and local-first Mac assistant (free mini & licensed pro)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial"]

[project.scripts]
ro = "ro.cli:main"
ro-pet = "ro_pet.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["ro", "ro_pet"]

[tool.hatch.build.targets.sdist]
# PyPI 소스 배포에는 패키지 코드와 테스트만 싣는다(사이트·발급 서버·빌드 로그·에이전트 지침은 빼고)
include = ["ro", "ro_pet", "tests", "README.md", "pyproject.toml"]
