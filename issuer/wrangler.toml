# ro pro 라이선스 발급기 배포 설정. 비밀값은 여기 쓰지 않고 `wrangler secret put 이름`으로 넣는다(issuer/worker.js 머리말).
name = "ro-license-issuer"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = false
routes = [{ pattern = "license.getropet.com", custom_domain = true }]

[vars]
LICENSE_KID = "ro1"       # ro/license.py PUBLIC_KEYS에 넣은 kid와 같게
MAIL_FROM = "ro <license@getropet.com>"   # Resend에서 getropet.com 도메인 인증 필요
POLAR_PRODUCT_IDS = "019cffa6-e87d-4dbb-a4d0-afca11e7f351,b6bdc9b1-6a76-4198-a084-8c8ee10915ad"
POLAR_API = "https://api.polar.sh"        # 운영 API (테스트는 https://sandbox-api.polar.sh)
POLAR_PRODUCT_YEARLY = "019cffa6-e87d-4dbb-a4d0-afca11e7f351"
POLAR_PRODUCT_MONTHLY = "b6bdc9b1-6a76-4198-a084-8c8ee10915ad"
SUCCESS_URL = "https://getropet.com/thanks/?checkout_id={CHECKOUT_ID}"

# 앱이 스스로 키를 받아 가게 하는 저장소
[[kv_namespaces]]
binding = "LICENSES"
id = "e0ab94b2198f4fba8c63505ba3c97032"
